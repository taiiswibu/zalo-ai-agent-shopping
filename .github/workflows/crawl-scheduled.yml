name: Scheduled Authorized Crawl
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1,4'
jobs:
  crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Crawl ONLY allowlisted sources (disable if no data source)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRAWL_ALLOWED_HOSTS: ${{ vars.CRAWL_ALLOWED_HOSTS }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$CRAWL_ALLOWED_HOSTS" ]; then
            echo "Crawler not configured: no external calls."
            exit 0
          fi
          python -m scripts.run_crawls --sources data/crawl_sources.txt
